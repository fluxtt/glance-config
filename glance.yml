theme:
  background-color: 240 8 9
  primary-color: 150 40 55
  positive-color: 150 60 50
  negative-color: 0 70 60
  contrast-multiplier: 1.1

branding:
  app-name: fluxt // control

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: UTC
                label: UTC

          - type: weather
            location: Exeter, United Kingdom
            units: metric
            hour-format: 24h

      - size: full
        widgets:
          - type: search
            search-engine: duckduckgo
            new-tab: true
            autofocus: true

          - type: dns-stats
            service: adguard
            url: http://192.168.1.99/
            username: james
            password: ${ADGUARD_PASSWORD}

      - size: small
        widgets:
          - type: bookmarks
            groups:
              - title: Homelab
                color: 150 40 55
                links:
                  - title: My repos
                    url: https://github.com/fluxtt?tab=repositories
                    icon: si:github
                  - title: Proxmox
                    url: https://192.168.1.101:8006
                    icon: si:proxmox

          - type: monitor
            title: Services
            cache: 2m
            sites:
              - title: AdGuard Home
                url: http://192.168.1.99/#
                icon: si:adguard

          - type: docker-containers
            sock-path: tcp://192.168.1.161:2375
            running-only: false

          # ENABLE ONCE PROXMOX API TOKEN IS SET UP:
